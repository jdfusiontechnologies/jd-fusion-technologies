<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Black Tile Base with Blue Border -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#000000" stroke="#2563EB" stroke-width="2.5" />
  
  <!-- Subtle Internal Grid Pattern -->
  <path d="M 20 50 L 80 50 M 50 20 L 50 80" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Monogram: "J" (Electric Blue) -->
  <path d="M 28 26 L 44 26 L 44 60 C 44 68 39 74 31 74 C 24 74 20 70 20 63 L 29 63 C 29 65 30 67 33 67 C 35 67 36 65 36 60 L 36 34 L 28 34 Z" fill="url(#blueGrad)" />

  <!-- Monogram: "D" / Fusion Loop (Radiant Orange) -->
  <path d="M 48 26 L 63 26 C 73 26 80 33 80 44 C 80 55 73 62 63 62 L 48 62 Z M 56 34 L 56 54 L 62 54 C 68 54 72 49 72 44 C 72 39 68 34 62 34 Z" fill="url(#orangeGrad)" />

  <!-- Fusion Intersection Pulse (Crisp White + Accent Orange Dot) -->
  <circle cx="48" cy="44" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="72" cy="68" r="4.5" fill="#FF7A00" />
  <circle cx="72" cy="68" r="2" fill="#FFFFFF" />
  
  <!-- Tech Connection Wire Line -->
  <path d="M 64 68 L 48 68" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
</svg>
