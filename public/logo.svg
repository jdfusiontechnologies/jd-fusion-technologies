<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Blue Gradient -->
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- Orange Gradient -->
    <linearGradient id="logoOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon (Black base with blue border) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#000000" stroke="#2563EB" stroke-width="2.5" />
    <!-- Grid -->
    <path d="M 20 50 L 80 50 M 50 20 L 50 80" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" />
    <!-- "J" in Electric Blue -->
    <path d="M 28 26 L 44 26 L 44 60 C 44 68 39 74 31 74 C 24 74 20 70 20 63 L 29 63 C 29 65 30 67 33 67 C 35 67 36 65 36 60 L 36 34 L 28 34 Z" fill="url(#logoBlueGrad)" />
    <!-- "D" in Radiant Orange -->
    <path d="M 48 26 L 63 26 C 73 26 80 33 80 44 C 80 55 73 62 63 62 L 48 62 Z M 56 34 L 56 54 L 62 54 C 68 54 72 49 72 44 C 72 39 68 34 62 34 Z" fill="url(#logoOrangeGrad)" />
    <!-- Intersection Node & Tech Accent -->
    <circle cx="48" cy="44" r="3.5" fill="#FFFFFF" filter="url(#logoGlow)" />
    <circle cx="72" cy="68" r="4.5" fill="#FF7A00" />
    <circle cx="72" cy="68" r="2" fill="#FFFFFF" />
    <path d="M 64 68 L 48 68" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <!-- "JD" in Electric Blue -->
    <text x="0" y="48" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="#2563EB">
      JD
    </text>
    <!-- "FUSION" in Radiant Orange -->
    <text x="64" y="48" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="#F97316">
      FUSION
    </text>
    <!-- "TECHNOLOGIES" in Clean Neutral / Dark-White adaptive -->
    <text x="238" y="48" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="34" letter-spacing="1" fill="#FFFFFF">
      TECH
    </text>
    <!-- Subtitle -->
    <text x="3" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="4" fill="#94A3B8">
      DIGITAL &amp; WEB SOLUTIONS
    </text>
  </g>
</svg>
